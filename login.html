<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập quản trị - HĐND Xã Đam Rông 1</title>
<link rel="icon" href="images/quoc-huy-v2.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  body{
    background:linear-gradient(135deg,var(--red-900),var(--red-700));
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-box{
    background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.3);
    padding:36px 32px;max-width:420px;width:100%;
  }
  .login-box .lb-head{text-align:center;margin-bottom:24px;}
  .login-box .lb-head img{width:64px;height:64px;margin:0 auto 12px;}
  .login-box .lb-head h1{font-size:18px;color:var(--red-800);margin:0 0 4px;font-weight:800;}
  .login-box .lb-head p{font-size:13px;color:#8a7355;margin:0;}
  .back-link{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--red-700);font-weight:600;}
  .note-box{background:var(--cream-200);border-radius:10px;padding:12px 14px;font-size:12px;color:#7a5c3c;margin-top:18px;line-height:1.6;}
</style>
</head>
<body>

<div class="login-box">
  <div class="lb-head">
    <img src="images/quoc-huy-v2.png" alt="Quốc huy">
    <h1>ĐĂNG NHẬP QUẢN TRỊ</h1>
    <p>Dành cho Cán bộ / Thường trực HĐND xã Đam Rông 1</p>
  </div>

  <div class="alert alert-error" id="login-error"></div>

  <form id="login-form">
    <div class="form-group">
      <label>Email <span class="req">*</span></label>
      <input type="email" class="form-control" id="login-email" required placeholder="ten@email.com">
    </div>
    <div class="form-group">
      <label>Mật khẩu <span class="req">*</span></label>
      <input type="password" class="form-control" id="login-password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn-submit" id="login-btn">
      <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
    </button>
  </form>

  <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ</a>

  <div class="note-box">
    <i class="fa-solid fa-circle-info"></i> Trang đăng nhập dành riêng cho Cán bộ / Thường trực HĐND xã Đam Rông 1.
    Vui lòng liên hệ quản trị viên nếu bạn chưa có tài khoản hoặc quên mật khẩu.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('login-error');
    errEl.classList.remove('show');
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang kiểm tra...';

    try {
      const result = await loginWithEmailPassword(email, password);
      if (result.ok) {
        window.location.href = 'dashboard.html';
      } else {
        errEl.textContent = result.message;
        errEl.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Đăng nhập';
      }
    } catch (err) {
      console.error(err);
      errEl.textContent = 'Có lỗi xảy ra, vui lòng thử lại.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Đăng nhập';
    }
  });

  // Nếu đã đăng nhập rồi thì chuyển thẳng vào dashboard
  waitForAuth().then(() => {
    if (isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }
  });
</script>
</body>
</html>
