<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mã QR theo thôn - HĐND Xã Đam Rông 1</title>
<link rel="icon" href="images/quoc-huy-v2.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .qr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;}
  .qr-card{background:#fff;border-radius:14px;box-shadow:var(--shadow-soft);padding:20px;text-align:center;}
  .qr-card .qr-canvas-box{width:150px;height:150px;margin:0 auto 12px;border:6px solid var(--cream-200);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .qr-card .qr-canvas-box img{width:100%;height:100%;}
  .qr-card h4{margin:0 0 4px;color:var(--red-800);font-size:15px;}
  .qr-card span{font-size:12px;color:#8a7355;}
</style>
</head>
<body>
<header id="site-header"></header>

<section class="page-hero">
  <h1><i class="fa-solid fa-qrcode"></i> Mã QR theo thôn</h1>
  <p>Quét mã QR để gửi kiến nghị nhanh chóng ngay tại thôn của bạn</p>
  <div class="breadcrumb"><a href="index.html">Trang chủ</a> / Mã QR theo thôn</div>
</section>

<section class="section">
  <div class="container">
    <div class="qr-grid" id="qr-grid">
      <div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i>Đang tải...</div>
    </div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="js/qr-thon.js"></script>
</body>
</html>
